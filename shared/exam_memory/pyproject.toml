[project]
name = "exam-memory"
version = "2.0.0"
description = "考试经验沉淀 MCP Server — V2 语义检索 + FTS 词法混合"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]
embed-api = [
    "litellm>=1.0",
    "numpy>=1.24.0",
]
ingest = [
    "docling>=2.0",
    "gitingest>=0.1",
    "PyGithub>=2.0",
    "beautifulsoup4>=4.12",
]
generate = [
    "litellm>=1.0",
]
full = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "docling>=2.0",
    "gitingest>=0.1",
    "PyGithub>=2.0",
    "beautifulsoup4>=4.12",
    "litellm>=1.0",
]

[project.scripts]
exam-memory = "exam_memory.server:cli_main"
review-schedule = "exam_memory.review_cli:main"
distill-export = "exam_memory.distill_export:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["exam_memory"]

[tool.setuptools.package-dir]
exam_memory = "."

[tool.setuptools.package-data]
exam_memory = ["sources.yaml", "bank/README.md"]
